<style>
/* === VIEWPORT BASE === */
/* ===========================================
   VIEWPORT FITTING: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   These styles ensure slides fit exactly in the viewport.
   =========================================== */

/* 1. Lock html/body to viewport */
html, body {
    height: 100%;
    overflow-x: hidden;
}

html {
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
}

/* 2. Each slide = exact viewport height */
.slide {
    width: 100vw;
    height: 100vh;
    height: 100dvh; /* Dynamic viewport height for mobile browsers */
    overflow: hidden; /* CRITICAL: Prevent ANY overflow */
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* 3. Content container with flex for centering */
.slide-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-height: 100%;
    overflow: hidden; /* Double-protection against overflow */
    padding: var(--slide-padding);
}

/* 4. ALL typography uses clamp() for responsive scaling */
:root {
    /* Titles scale from mobile to desktop */
    --title-size: clamp(1.5rem, 5vw, 4rem);
    --h2-size: clamp(1.25rem, 3.5vw, 2.5rem);
    --h3-size: clamp(1rem, 2.5vw, 1.75rem);

    /* Body text */
    --body-size: clamp(0.75rem, 1.5vw, 1.125rem);
    --small-size: clamp(0.65rem, 1vw, 0.875rem);

    /* Spacing scales with viewport */
    --slide-padding: clamp(1rem, 4vw, 4rem);
    --content-gap: clamp(0.5rem, 2vw, 2rem);
    --element-gap: clamp(0.25rem, 1vw, 1rem);
}

/* 5. Cards/containers use viewport-relative max sizes */
.card, .container, .content-box {
    max-width: min(90vw, 1000px);
    max-height: min(80vh, 700px);
}

/* 6. Lists auto-scale with viewport */
.feature-list, .bullet-list {
    gap: clamp(0.4rem, 1vh, 1rem);
}

.feature-list li, .bullet-list li {
    font-size: var(--body-size);
    line-height: 1.4;
}

/* 7. Grids adapt to available space */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
    gap: clamp(0.5rem, 1.5vw, 1rem);
}

/* 8. Images constrained to viewport */
img, .image-container {
    max-width: 100%;
    max-height: min(50vh, 400px);
    object-fit: contain;
}

/* ===========================================
   RESPONSIVE BREAKPOINTS
   Aggressive scaling for smaller viewports
   =========================================== */

/* Short viewports (< 700px height) */
@media (max-height: 700px) {
    :root {
        --slide-padding: clamp(0.75rem, 3vw, 2rem);
        --content-gap: clamp(0.4rem, 1.5vw, 1rem);
        --title-size: clamp(1.25rem, 4.5vw, 2.5rem);
        --h2-size: clamp(1rem, 3vw, 1.75rem);
    }
}

/* Very short viewports (< 600px height) */
@media (max-height: 600px) {
    :root {
        --slide-padding: clamp(0.5rem, 2.5vw, 1.5rem);
        --content-gap: clamp(0.3rem, 1vw, 0.75rem);
        --title-size: clamp(1.1rem, 4vw, 2rem);
        --body-size: clamp(0.7rem, 1.2vw, 0.95rem);
    }

    /* Hide non-essential elements */
    .nav-dots, .keyboard-hint, .decorative {
        display: none;
    }
}

/* Extremely short (landscape phones, < 500px height) */
@media (max-height: 500px) {
    :root {
        --slide-padding: clamp(0.4rem, 2vw, 1rem);
        --title-size: clamp(1rem, 3.5vw, 1.5rem);
        --h2-size: clamp(0.9rem, 2.5vw, 1.25rem);
        --body-size: clamp(0.65rem, 1vw, 0.85rem);
    }
}

/* Narrow viewports (< 600px width) */
@media (max-width: 600px) {
    :root {
        --title-size: clamp(1.25rem, 7vw, 2.5rem);
    }

    /* Stack grids vertically */
    .grid {
        grid-template-columns: 1fr;
    }
}

/* ===========================================
   REDUCED MOTION
   Respect user preferences
   =========================================== */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }

    html {
        scroll-behavior: auto;
    }
}

 恢复鼠标。\n\n提醒\n两个窗口都能标注。笔迹仅在本次演示中保留，刷新观众窗口后清空，不写入 HTML 或打印内容。", "[02:00–02:40] 设置\n使用扩展桌面，不要镜像。演讲者窗口留在笔记本上，原幻灯片窗口移到观众屏幕，点击后按 F。\n\n保存\n编辑一条讲稿。说明浏览器保留草稿，保存 HTML 可携带编辑后的讲稿。线上只共享观众窗口。\n\n结束\n“观众跟随想法，你始终看得见思路。”"], "presenter": {"presenter": "演讲者模式", "slides": "幻灯片", "notesLanguage": "讲稿语言", "uiLanguage": "界面语言", "current": "当前页面", "next": "下一页", "notes": "演讲者讲稿", "jump": "跳转到页面", "previous": "← 上一页", "forward": "下一页 →", "mouse": "鼠标", "laser": "蓝色激光笔 · L", "pen": "画笔 · D", "clear": "清除本页批注", "exportNotes": "导出讲稿", "exportHTML": "保存 HTML", "screens": "选择显示器", "fullscreen": "观众全屏 · F", "setup": "双屏设置", "end": "已到最后一页", "blackBadge": "观众屏幕已黑屏", "start": "开始计时", "pause": "暂停计时", "blackout": "黑屏 · B", "resume": "恢复画面 · B", "connected": "已连接", "disconnected": "观众窗口已断开", "saved": "讲稿已保存于本浏览器", "unsaved": "存储不可用，请保存 HTML 保留讲稿。", "reset": "重置计时", "smaller": "缩小讲稿字号", "larger": "放大讲稿字号", "placeholder": "为这一页添加讲稿…", "navigation": "← → 翻页 · Home / End 首尾页 · 编辑时暂停快捷键。", "setupText": "使用扩展桌面。演讲者窗口留在笔记本上。将原幻灯片窗口移至观众屏幕，点击后按 F。线上只分享该窗口。", "inkHelp": "L：激光笔。D：画笔。Esc：鼠标。清除仅删除本页笔迹。笔迹刷新后清空，不导出。讲稿仍保留在 HTML 源码中。预览为静态画面。"}, "warnings": ["浏览器不支持自动选屏。请手动将幻灯片移至扩展屏，点击后按 F。", "未获得显示器权限。请手动移动幻灯片，点击后按 F。", "远程全屏受限。请点击观众窗口后按 F，或使用浏览器全屏菜单。"]}, "ja": {"ui": ["スライド", "発表者モード", "ノートの言語"], "slides": [{"tag": "スキル紹介", "kicker": "Frontend Slides Presenter", "title": "話の流れを、いつも手元に。", "sub": "聞き手にはスライドを。自分にはノート、次の展開、残り時間を。", "foot": "frontend-slides のための発表支援"}, {"tag": "話の流れ", "kicker": "開発した理由", "title": "迷わず、話をつなぐ。", "a": "要点を忘れない", "ad": "自分用ノートで、要点とつなぎを確認できます。", "b": "次の展開を見る", "bd": "現在と次のスライドを見て、自然につなげます。", "c": "ペースを保つ", "cd": "タイマー、ページ移動、暗転で進行を調整します。", "foot": "聞き手の画面と、発表者の画面。"}, {"tag": "実演ツール", "kicker": "注目を集める", "title": "指し示す。描いて伝える。", "a": "青いレーザー · L", "ad": "ここに注目。", "ae": "青いポインターで細部を示します。線は残りません。", "b": "ペン · D", "bd": "つながりを見せる。", "be": "大事な箇所を囲み、関係を描きます。線は各ページに残ります。", "foot": "両方の画面から描画 · Esc でマウスへ · このページだけ消去"}, {"tag": "使い始める", "kicker": "ファイルから本番へ", "title": "開く。分ける。話す。", "sub": "P で発表者画面を開いて手元に残し、スライドを拡張画面へ移動。クリックして F を押します。", "foot": "ノートを編集 · HTML に保存して持ち運ぶ"}], "notes": ["[00:00–00:35] 導入\n「良いスライドは聞き手を助けます。では、話し手を助けるものは？」と問い、一呼吸置きます。\n\n説明\nこのスキルは frontend-slides に発表者専用の画面を追加します。聞き手にはスライド、自分にはノートと進行の手がかりが見えます。\n\nつなぎ\n「話の流れをどう支えるか見てみましょう。」", "[00:35–01:15] 説明\n3つの欄を順に示します。ノートで要点を確認し、次のスライドでつなぎを準備し、タイマーでペースを調整します。\n\n実演\nP を押し、矢印キーで1ページ進めます。両画面の同期を見せます。B で暗転させ、もう一度 B で戻します。\n\nつなぎ\n「言葉だけでなく、指し示したい場面もあります。」", "[01:15–02:00] レーザー\nL を押して現在のプレビュー上を動かします。聞き手にも青い点が見え、線は残りません。\n\nペン\nD を押して文章を囲みます。別のページへ移動して戻り、線が残ることを見せます。このページの消去はノートに影響しません。Esc でマウスに戻ります。\n\n注意\nどちらの画面でも描けます。線は一時的で、聞き手の画面を再読み込みすると消え、HTML や印刷には含まれません。", "[02:00–02:40] 準備\nミラーリングではなく拡張デスクトップを使います。発表者画面を手元に残し、元のスライド画面を外部画面へ移動。クリックして F を押します。\n\n保存\nノートを編集します。下書きはブラウザーに保存され、HTML を保存すれば編集内容を持ち運べます。オンラインでは聞き手の画面だけを共有します。\n\n締め\n「聞き手は内容を追い、話し手は流れを見失いません。」"], "presenter": {"presenter": "発表者モード", "slides": "スライド", "notesLanguage": "ノートの言語", "uiLanguage": "画面の言語", "current": "現在のスライド", "next": "次のスライド", "notes": "発表者ノート", "jump": "スライドへ移動", "previous": "← 前へ", "forward": "次へ →", "mouse": "マウス", "laser": "青いレーザー · L", "pen": "ペン · D", "clear": "このページを消去", "exportNotes": "ノートを書き出す", "exportHTML": "HTML を保存", "screens": "画面を選択", "fullscreen": "聞き手側を全画面 · F", "setup": "画面の設定", "end": "最後のスライドです", "blackBadge": "聞き手の画面は暗転中", "start": "計測開始", "pause": "一時停止", "blackout": "暗転 · B", "resume": "再表示 · B", "connected": "接続済み", "disconnected": "聞き手の画面と切断", "saved": "このブラウザーに保存済み", "unsaved": "保存できません。HTML を保存してください。", "reset": "タイマーをリセット", "smaller": "文字を小さく", "larger": "文字を大きく", "placeholder": "発表者ノートを入力…", "navigation": "← → 移動 · Home / End · 編集中はショートカット停止。", "setupText": "拡張デスクトップを使います。発表者画面を手元に残し、元のスライドを外部画面へ移動。クリックして F を押します。オンラインではその画面だけを共有します。", "inkHelp": "L：レーザー。D：ペン。Esc：マウス。消去は現在のページのみ。線は再読み込みで消え、書き出されません。ノートは HTML ソースに残ります。プレビューは静止画です。"}, "warnings": ["画面の自動選択は使えません。スライドを拡張画面へ手動で移動し、クリックして F を押してください。", "画面へのアクセスが許可されませんでした。スライドを手動で移動し、クリックして F を押してください。", "遠隔の全画面表示が制限されました。聞き手の画面をクリックして F を押すか、ブラウザーの全画面メニューを使ってください。"]}, "ko": {"ui": ["슬라이드", "발표자 모드", "발표 노트 언어"], "slides": [{"tag": "스킬 소개", "kicker": "Frontend Slides Presenter", "title": "발표 흐름을 늘 눈앞에.", "sub": "청중에게는 슬라이드를, 발표자에게는 노트와 다음 단계, 시간을 보여 줍니다.", "foot": "frontend-slides를 위한 발표 도우미"}, {"tag": "발표 흐름", "kicker": "만든 이유", "title": "흐름을 놓치지 않고 말하세요.", "a": "핵심 기억하기", "ad": "개인 노트로 요점과 전환 문구를 확인하세요.", "b": "다음 내용 보기", "bd": "현재와 다음 슬라이드로 자연스럽게 이어 가세요.", "c": "속도 조절하기", "cd": "타이머, 페이지 이동, 화면 끄기로 진행을 조절하세요.", "foot": "청중 창 하나. 발표자 창 하나."}, {"tag": "실시간 도구", "kicker": "시선을 이끌기", "title": "가리키고, 그려 보세요.", "a": "파란 레이저 · L", "ad": "여기를 보세요.", "ae": "움직이는 파란 점으로 세부 내용을 강조합니다. 흔적은 남지 않습니다.", "b": "펜 · D", "bd": "관계를 보여 주세요.", "be": "중요한 부분에 동그라미를 치고 연결을 그립니다. 필기는 해당 슬라이드에 남습니다.", "foot": "두 창에서 그리기 · Esc로 마우스 전환 · 현재 페이지만 지우기"}, {"tag": "시작하기", "kicker": "파일에서 발표까지", "title": "열고, 나누고, 발표하세요.", "sub": "P로 발표자 창을 열어 노트북에 두세요. 슬라이드를 확장 화면으로 옮긴 뒤 클릭하고 F를 누르세요.", "foot": "노트 편집 · HTML로 저장해 가져가기"}], "notes": ["[00:00–00:35] 시작\n“좋은 슬라이드는 청중을 돕습니다. 그렇다면 발표자는 누가 도울까요?” 잠시 멈추세요.\n\n설명\n이 스킬은 frontend-slides에 개인 발표자 창을 더합니다. 청중은 깔끔한 슬라이드를 보고, 발표자는 노트와 진행 단서를 봅니다.\n\n전환\n“발표 흐름을 어떻게 돕는지 보겠습니다.”", "[00:35–01:15] 설명\n세 칸을 차례로 가리키세요. 노트는 핵심을, 다음 슬라이드는 전환을, 타이머는 속도 조절을 돕습니다.\n\n시연\nP로 발표자 창을 열고 방향키로 한 장 넘기세요. 두 창의 동기화를 보여 주세요. B로 잠시 화면을 끄고 다시 B로 돌아오세요.\n\n전환\n“말보다 가리키는 것이 좋을 때도 있습니다.”", "[01:15–02:00] 레이저\nL을 누르고 현재 미리보기 위에서 움직이세요. 청중에게도 같은 파란 점이 보이며 흔적은 남지 않습니다.\n\n펜\nD를 눌러 문구를 동그라미로 표시하세요. 다른 슬라이드로 갔다 돌아와 필기가 남는 것을 보여 주세요. 현재 페이지 지우기는 노트에 영향을 주지 않습니다. Esc로 마우스로 돌아오세요.\n\n기억하기\n두 창에서 그릴 수 있습니다. 필기는 일시적이며 청중 창을 새로 고치면 사라지고 HTML과 인쇄에는 포함되지 않습니다.", "[02:00–02:40] 설정\n화면 복제가 아닌 확장 데스크톱을 사용하세요. 발표자 창은 노트북에, 원래 슬라이드 창은 청중 화면에 둡니다. 청중 창을 클릭하고 F를 누르세요.\n\n저장\n노트를 편집하세요. 초안은 브라우저에 저장되고 HTML 저장으로 편집 내용을 가져갈 수 있습니다. 온라인에서는 청중 창만 공유하세요.\n\n마무리\n“청중은 생각을 따라가고, 발표자는 흐름을 놓치지 않습니다.”"], "presenter": {"presenter": "발표자 모드", "slides": "슬라이드", "notesLanguage": "노트 언어", "uiLanguage": "인터페이스 언어", "current": "현재 슬라이드", "next": "다음 슬라이드", "notes": "발표자 노트", "jump": "슬라이드로 이동", "previous": "← 이전", "forward": "다음 →", "mouse": "마우스", "laser": "파란 레이저 · L", "pen": "펜 · D", "clear": "현재 페이지 지우기", "exportNotes": "노트 내보내기", "exportHTML": "HTML 저장", "screens": "화면 선택", "fullscreen": "청중 화면 전체 화면 · F", "setup": "화면 설정", "end": "마지막 슬라이드입니다", "blackBadge": "청중 화면이 꺼져 있습니다", "start": "타이머 시작", "pause": "타이머 일시 정지", "blackout": "화면 끄기 · B", "resume": "화면 복원 · B", "connected": "연결됨", "disconnected": "청중 창 연결 끊김", "saved": "이 브라우저에 노트 저장됨", "unsaved": "저장할 수 없습니다. HTML을 저장하세요.", "reset": "타이머 초기화", "smaller": "노트 글자 축소", "larger": "노트 글자 확대", "placeholder": "발표 노트를 입력하세요…", "navigation": "← → 이동 · Home / End · 편집 중 단축키 중지.", "setupText": "확장 데스크톱을 사용하세요. 발표자 창은 노트북에 두고 원래 슬라이드 창을 청중 화면으로 옮긴 뒤 클릭하고 F를 누르세요. 온라인에서는 그 창만 공유하세요.", "inkHelp": "L: 레이저. D: 펜. Esc: 마우스. 현재 페이지만 지웁니다. 필기는 새로 고침 시 사라지고 내보내지 않습니다. 노트는 HTML 소스에 남습니다. 미리보기는 정적입니다."}, "warnings": ["자동 화면 선택을 사용할 수 없습니다. 슬라이드를 확장 화면으로 직접 옮기고 클릭한 뒤 F를 누르세요.", "화면 접근 권한이 없습니다. 슬라이드를 직접 옮기고 클릭한 뒤 F를 누르세요.", "원격 전체 화면이 차단되었습니다. 청중 창을 클릭하고 F를 누르거나 브라우저 전체 화면 메뉴를 사용하세요."]}, "es": {"ui": ["Diapositivas", "Presentador", "Idioma de las notas"], "slides": [{"tag": "La herramienta", "kicker": "Frontend Slides Presenter", "title": "Mantén el hilo a la vista.", "sub": "El público ve las diapositivas. Tú tienes las notas, el siguiente paso y el tiempo a mano.", "foot": "Un complemento para presentar con frontend-slides"}, {"tag": "El ritmo", "kicker": "Por qué lo creamos", "title": "Presenta sin perder el hilo.", "a": "Recuerda lo esencial", "ad": "Las notas privadas acercan los puntos clave y las transiciones.", "b": "Anticipa lo que viene", "bd": "Las vistas actual y siguiente facilitan el paso entre ideas.", "c": "Controla el ritmo", "cd": "Temporizador, salto de diapositiva y pantalla negra a tu alcance.", "foot": "Una ventana para el público. Otra para ti."}, {"tag": "Herramientas en vivo", "kicker": "Guía la atención", "title": "Señala. Dibuja. Explica.", "a": "LÁSER AZUL · L", "ad": "Mira aquí.", "ae": "Destaca un detalle con un punto azul móvil, sin dejar trazos.", "b": "LÁPIZ · D", "bd": "Haz visible la conexión.", "be": "Rodea un detalle o dibuja una relación. Los trazos quedan en esa diapositiva.", "foot": "Dibuja en ambas ventanas · Esc vuelve al ratón · Borra solo esta página"}, {"tag": "Para empezar", "kicker": "Del archivo a la charla", "title": "Abre. Separa. Presenta.", "sub": "Pulsa P y deja Presentador en el portátil. Mueve las diapositivas a una pantalla extendida, haz clic y pulsa F.", "foot": "Edita las notas · Guarda el HTML para llevarlas contigo"}], "notes": ["[00:00–00:35] INICIO\n«Las buenas diapositivas ayudan al público. ¿Qué ayuda a quien presenta?» Haz una pausa.\n\nEXPLICA\nEsta herramienta añade una ventana privada a frontend-slides. El público ve diapositivas claras; tú ves el guion y las indicaciones.\n\nTRANSICIÓN\n«Veamos cómo mantiene el hilo de la charla».", "[00:35–01:15] EXPLICA\nSeñala las tres columnas: notas para recordar lo esencial, vista siguiente para las transiciones y temporizador para el ritmo.\n\nDEMUESTRA\nPulsa P y avanza con las flechas. Muestra la sincronización. Pulsa B para apagar brevemente la pantalla y atraer la atención hacia ti. Pulsa B de nuevo.\n\nTRANSICIÓN\n«A veces necesitamos señalar, no solo hablar».", "[01:15–02:00] LÁSER\nPulsa L y muévete por la vista actual. El público ve el mismo punto azul, sin trazos permanentes.\n\nLÁPIZ\nPulsa D y rodea una frase. Cambia de diapositiva y vuelve: las marcas siguen ahí. Borrar esta página solo elimina sus trazos, no las notas. Pulsa Esc para volver al ratón.\n\nRECUERDA\nPuedes dibujar en ambas ventanas. Los trazos son temporales, desaparecen al recargar el público y no se exportan ni se imprimen.", "[02:00–02:40] PREPARA\nUsa escritorio extendido, sin duplicar pantallas. Deja Presentador en el portátil y mueve la ventana original al público. Haz clic y pulsa F.\n\nGUARDA\nEdita una nota. Los borradores quedan en el navegador; Guardar HTML incluye las notas editadas. En línea, comparte solo la ventana del público.\n\nCIERRE\n«El público sigue la idea. Tú mantienes el hilo a la vista»."], "presenter": {"presenter": "Presentador", "slides": "Diapositivas", "notesLanguage": "Idioma de notas", "uiLanguage": "Idioma de interfaz", "current": "DIAPOSITIVA ACTUAL", "next": "SIGUIENTE DIAPOSITIVA", "notes": "NOTAS DEL PRESENTADOR", "jump": "Ir a diapositiva", "previous": "← Anterior", "forward": "Siguiente →", "mouse": "Ratón", "laser": "Láser azul · L", "pen": "Lápiz · D", "clear": "Borrar esta página", "exportNotes": "Exportar notas", "exportHTML": "Guardar HTML", "screens": "Elegir pantalla", "fullscreen": "Público a pantalla completa · F", "setup": "Configurar pantallas", "end": "Fin de la presentación", "blackBadge": "La pantalla del público está negra", "start": "Iniciar temporizador", "pause": "Pausar temporizador", "blackout": "Pantalla negra · B", "resume": "Restaurar · B", "connected": "Conectado", "disconnected": "Público desconectado", "saved": "Notas guardadas en este navegador", "unsaved": "Sin almacenamiento. Guarda el HTML para conservar las notas.", "reset": "Reiniciar temporizador", "smaller": "Reducir texto", "larger": "Ampliar texto", "placeholder": "Escribe tus notas…", "navigation": "← → Navegar · Home / End · Atajos suspendidos al editar.", "setupText": "Usa escritorio extendido. Deja Presentador en el portátil. Mueve la ventana original al público, haz clic y pulsa F. En línea, comparte solo esa ventana.", "inkHelp": "L: láser. D: lápiz. Esc: ratón. Borra solo los trazos de esta página. Se eliminan al recargar y no se exportan. Las notas quedan en el código HTML. Las vistas previas son estáticas."}, "warnings": ["La selección automática no está disponible. Mueve los slides manualmente a la pantalla extendida, haz clic y pulsa F.", "No se concedió permiso de pantalla. Mueve los slides manualmente, haz clic y pulsa F.", "Se bloqueó la pantalla completa remota. Haz clic en la ventana del público y pulsa F, o usa el menú del navegador."]}, "fr": {"ui": ["Diapositives", "Présentateur", "Langue des notes"], "slides": [{"tag": "L’outil", "kicker": "Frontend Slides Presenter", "title": "Gardez le fil sous les yeux.", "sub": "Le public voit les diapositives. Vous gardez vos notes, la suite et le temps sous les yeux.", "foot": "Un compagnon de présentation pour frontend-slides"}, {"tag": "Le déroulé", "kicker": "Pourquoi cet outil", "title": "Présentez sans perdre le fil.", "a": "Retrouvez vos repères", "ad": "Les notes privées gardent vos points clés et vos transitions à portée de vue.", "b": "Anticipez la suite", "bd": "Les aperçus actuel et suivant facilitent les enchaînements.", "c": "Maîtrisez le rythme", "cd": "Chronomètre, saut de diapositive et écran noir vous accompagnent.", "foot": "Une fenêtre pour le public. Une pour vous."}, {"tag": "Outils en direct", "kicker": "Guidez l’attention", "title": "Montrez. Dessinez. Expliquez.", "a": "LASER BLEU · L", "ad": "Regardez ici.", "ae": "Soulignez un détail avec un point bleu mobile, sans laisser de trace.", "b": "STYLO · D", "bd": "Rendez le lien visible.", "be": "Entourez un détail ou dessinez un lien. Les traits restent sur leur diapositive.", "foot": "Dessinez dans les deux fenêtres · Esc revient à la souris · Effacement par page"}, {"tag": "Pour commencer", "kicker": "Du fichier à la scène", "title": "Ouvrez. Séparez. Présentez.", "sub": "Appuyez sur P et gardez Présentateur sur le portable. Déplacez les diapositives vers l’écran étendu, cliquez et appuyez sur F.", "foot": "Modifiez les notes · Enregistrez le HTML pour les emporter"}], "notes": ["[00:00–00:35] OUVERTURE\n« Les bonnes diapositives aident le public. Mais qui aide la personne qui présente ? » Faites une pause.\n\nEXPLIQUEZ\nCet outil ajoute une fenêtre privée à frontend-slides. Le public voit les diapositives ; vous gardez votre texte et vos repères sous les yeux.\n\nTRANSITION\n« Voyons comment garder le fil. »", "[00:35–01:15] EXPLIQUEZ\nMontrez les trois colonnes : les notes pour les points clés, l’aperçu suivant pour les transitions, le chronomètre pour le rythme.\n\nDÉMONTREZ\nAppuyez sur P puis avancez avec les flèches. Montrez la synchronisation. Appuyez sur B pour attirer l’attention sur vous, puis sur B pour revenir.\n\nTRANSITION\n« Parfois, il faut montrer plutôt que parler. »", "[01:15–02:00] LASER\nAppuyez sur L et déplacez le pointeur dans l’aperçu actuel. Le public voit le même point bleu, sans trace.\n\nSTYLO\nAppuyez sur D et entourez une phrase. Changez de page puis revenez : les traits sont conservés. Effacer cette page ne touche ni les autres pages ni les notes. Esc revient à la souris.\n\nÀ RETENIR\nLes deux fenêtres permettent de dessiner. Les traits sont temporaires, disparaissent au rechargement du public et sont exclus du HTML et de l’impression.", "[02:00–02:40] INSTALLATION\nUtilisez le bureau étendu, sans duplication. Gardez Présentateur sur le portable et déplacez la fenêtre originale vers le public. Cliquez dessus puis appuyez sur F.\n\nSAUVEGARDE\nModifiez une note. Le navigateur conserve les brouillons ; Enregistrer le HTML emporte les notes modifiées. En ligne, partagez seulement la fenêtre du public.\n\nCONCLUSION\n« Le public suit l’idée. Vous gardez le fil sous les yeux. »"], "presenter": {"presenter": "Présentateur", "slides": "Diapositives", "notesLanguage": "Langue des notes", "uiLanguage": "Langue de l’interface", "current": "DIAPOSITIVE ACTUELLE", "next": "DIAPOSITIVE SUIVANTE", "notes": "NOTES DU PRÉSENTATEUR", "jump": "Aller à la diapositive", "previous": "← Précédente", "forward": "Suivante →", "mouse": "Souris", "laser": "Laser bleu · L", "pen": "Stylo · D", "clear": "Effacer cette page", "exportNotes": "Exporter les notes", "exportHTML": "Enregistrer le HTML", "screens": "Choisir l’écran", "fullscreen": "Public en plein écran · F", "setup": "Configurer les écrans", "end": "Fin de la présentation", "blackBadge": "L’écran du public est noir", beim Neuladen des Publikumsfensters und fehlen in HTML und Druck.", "[02:00–02:40] EINRICHTEN\nErweiterten Desktop statt Spiegelung verwenden. Referentenansicht am Laptop lassen, ursprüngliches Folienfenster auf den Publikumsbildschirm ziehen. Dort klicken und F drücken.\n\nSPEICHERN\nEine Notiz bearbeiten. Der Browser speichert Entwürfe; HTML speichern nimmt die bearbeiteten Notizen mit. Online nur das Publikumsfenster teilen.\n\nABSCHLUSS\n„Das Publikum folgt der Idee. Sie behalten den Ablauf im Blick.“"], "presenter": {"presenter": "Referentenansicht", "slides": "Folien", "notesLanguage": "Notizensprache", "uiLanguage": "Oberflächensprache", "current": "AKTUELLE FOLIE", "next": "NÄCHSTE FOLIE", "notes": "SPRECHNOTIZEN", "jump": "Zur Folie", "previous": "← Zurück", "forward": "Weiter →", "mouse": "Maus", "laser": "Blauer Laser · L", "pen": "Stift · D", "clear": "Diese Folie löschen", "exportNotes": "Notizen exportieren", "exportHTML": "HTML speichern", "screens": "Bildschirm wählen", "fullscreen": "Publikum im Vollbild · F", "setup": "Bildschirme einrichten", "end": "Ende der Präsentation", "blackBadge": "Publikumsbildschirm ist schwarz", "start": "Timer starten", "pause": "Timer pausieren", "blackout": "Schwarzbild · B", "resume": "Fortsetzen · B", "connected": "Verbunden", "disconnected": "Publikum getrennt", "saved": "Notizen im Browser gespeichert", "unsaved": "Speicher nicht verfügbar. HTML speichern, um Notizen zu behalten.", "reset": "Timer zurücksetzen", "smaller": "Schrift verkleinern", "larger": "Schrift vergrößern", "placeholder": "Sprechnotizen eingeben…", "navigation": "← → Navigieren · Home / End · Beim Bearbeiten keine Tastenkürzel.", "setupText": "Erweiterten Desktop nutzen. Referentenansicht am Laptop lassen. Originalfolien zum Publikumsbildschirm ziehen, anklicken und F drücken. Online nur dieses Fenster teilen.", "inkHelp": "L: Laser. D: Stift. Esc: Maus. Löschen betrifft nur diese Folie. Linien verschwinden beim Neuladen und werden nicht exportiert. Notizen bleiben im HTML-Quelltext. Vorschauen sind statisch."}, "warnings": ["Automatische Bildschirmwahl ist nicht verfügbar. Folien manuell auf den erweiterten Bildschirm ziehen, anklicken und F drücken.", "Bildschirmzugriff wurde nicht erlaubt. Folien manuell verschieben, anklicken und F drücken.", "Vollbild aus der Ferne wurde blockiert. Publikumsfenster anklicken und F drücken oder das Browsermenü nutzen."]}, "ar": {"ui": ["الشرائح", "وضع المقدّم", "لغة الملاحظات"], "slides": [{"tag": "التعريف بالأداة", "kicker": "Frontend Slides Presenter", "title": "أبقِ تسلسل الحديث أمامك.", "sub": "يرى الجمهور الشرائح، وتبقى ملاحظاتك وخطوتك التالية والوقت أمام عينيك.", "foot": "أداة مساعدة لتقديم عروض frontend-slides"}, {"tag": "تسلسل العرض", "kicker": "لماذا أنشأناها", "title": "قدّم فكرتك دون أن تفقد الخيط.", "a": "تذكّر النقاط الأساسية", "ad": "تُبقي الملاحظات الخاصة أفكارك وانتقالاتك قريبة منك.", "b": "شاهد ما يأتي لاحقًا", "bd": "تساعدك معاينة الشريحة الحالية والتالية على الانتقال بسلاسة.", "c": "اضبط الإيقاع", "cd": "مؤقّت وانتقال بين الشرائح وشاشة سوداء للتحكم في العرض.", "foot": "نافذة للجمهور. ونافذة للمقدّم."}, {"tag": "أدوات مباشرة", "kicker": "وجّه الانتباه", "title": "أشر إلى الفكرة. وارسم الرابط.", "a": "الليزر الأزرق · L", "ad": "انظر هنا.", "ae": "أبرز تفصيلًا بنقطة زرقاء متحركة دون ترك أثر.", "b": "القلم · D", "bd": "اجعل العلاقة مرئية.", "be": "ضع دائرة حول تفصيل أو ارسم رابطًا. تبقى العلامات على شريحتها.", "foot": "ارسم في النافذتين · Esc للعودة إلى الفأرة · امسح هذه الصفحة فقط"}, {"tag": "ابدأ الآن", "kicker": "من الملف إلى العرض", "title": "افتح. افصل. قدّم.", "sub": "اضغط P وأبقِ نافذة المقدّم على حاسوبك. انقل الشرائح إلى الشاشة الممتدة، ثم انقر عليها واضغط F.", "foot": "حرّر الملاحظات · احفظ HTML لأخذها معك"}], "notes": ["[00:00–00:35] البداية\n«تساعد الشرائح الجيدة الجمهور، لكن ما الذي يساعد المقدّم؟» توقّف قليلًا.\n\nاشرح\nتضيف هذه الأداة نافذة خاصة للمقدّم إلى frontend-slides. يرى الجمهور الشرائح، بينما ترى أنت النص وإشارات الانتقال.\n\nانتقال\n«لنرَ كيف نحافظ على تسلسل الحديث».", "[00:35–01:15] اشرح\nأشر إلى الأعمدة الثلاثة: الملاحظات لتذكّر الفكرة، والمعاينة التالية للانتقال، والمؤقّت لضبط الإيقاع.\n\nاعرض\nاضغط P ثم انتقل بالسهم. وضّح تزامن النافذتين. اضغط B لإظلام الشاشة وإعادة الانتباه إليك، ثم اضغط B مجددًا.\n\nانتقال\n«أحيانًا نحتاج إلى الإشارة، لا إلى الكلام فقط».", "[01:15–02:00] الليزر\nاضغط L وحرّك المؤشر فوق المعاينة الحالية. يرى الجمهور النقطة الزرقاء نفسها دون أثر دائم.\n\nالقلم\nاضغط D وضع دائرة حول عبارة. انتقل إلى شريحة أخرى ثم عد لترى العلامات. مسح هذه الصفحة يزيل خطوطها فقط ولا يمس الملاحظات. اضغط Esc للعودة إلى الفأرة.\n\nتذكّر\nيمكن الرسم في النافذتين. الخطوط مؤقتة، وتختفي عند إعادة تحميل نافذة الجمهور، ولا تُضمّن في HTML أو الطباعة.", "[02:00–02:40] الإعداد\nاستخدم سطح مكتب ممتدًا دون نسخ الشاشة. أبقِ نافذة المقدّم على حاسوبك وانقل نافذة الشرائح الأصلية إلى شاشة الجمهور، ثم انقر واضغط F.\n\nالحفظ\nحرّر ملاحظة. يحتفظ المتصفح بالمسودات، ويحمل حفظ HTML الملاحظات المعدّلة داخل الملف. عبر الإنترنت، شارك نافذة الجمهور فقط.\n\nالختام\n«يتابع الجمهور الفكرة، ويبقى تسلسل الحديث أمام عينيك»."], "presenter": {"presenter": "وضع المقدّم", "slides": "الشرائح", "notesLanguage": "لغة الملاحظات", "uiLanguage": "لغة الواجهة", "current": "الشريحة الحالية", "next": "الشريحة التالية", "notes": "ملاحظات المقدّم", "jump": "انتقل إلى الشريحة", "previous": "السابق", "forward": "التالي", "mouse": "الفأرة", "laser": "الليزر الأزرق · L", "pen": "القلم · D", "clear": "امسح هذه الصفحة", "exportNotes": "تصدير الملاحظات", "exportHTML": "حفظ HTML", "screens": "اختر الشاشة", "fullscreen": "ملء شاشة الجمهور · F", "setup": "إعداد الشاشات", "end": "نهاية العرض", "blackBadge": "شاشة الجمهور سوداء", "start": "بدء المؤقّت", "pause": "إيقاف المؤقّت مؤقتًا", "blackout": "شاشة سوداء · B", "resume": "استعادة العرض · B", "connected": "متصل", "disconnected": "انقطع اتصال الجمهور", "saved": "حُفظت الملاحظات في المتصفح", "unsaved": "التخزين غير متاح. احفظ HTML للاحتفاظ بالملاحظات.", "reset": "إعادة ضبط المؤقّت", "smaller": "تصغي     function renderInk(value){
      inkModel=value;inkBoard.render(value);
      for(const [id,mode] of [['toolOff','off'],['toolLaser','laser'],['toolPen','pen']])$(id).setAttribute('aria-pressed',String(value.mode===mode));
    }
    window.addEventListener('scroll',()=>inkBoard.layout(),true);
    window.addEventListener('pagehide',()=>{try{api?.unsubscribeInk(window);}catch{}});
    const message = text => { $('message').textContent = text; api?.renderPresenter?.(window, state); };
    const editable = target => !!target.closest('textarea,input,select,[contenteditable]');
    const formatTime = ms => {
      const seconds = Math.floor(ms / 1000);
      return (seconds >= 3600 ? String(Math.floor(seconds / 3600)).padStart(2,'0') + ':' : '') + String(Math.floor(seconds / 60) % 60).padStart(2,'0') + ':' + String(seconds % 60).padStart(2,'0');
    };
    const action = fn => {
      try { if (!api) throw new Error('观众窗口未连接。'); fn(api); refresh(); }
      catch (error) { message(error.message); }
    };
    function fit(frame) {
      const size = frame._size;
      const stage = frame.contentDocument?.querySelector('[data-fsp-stage]');
      if (!size || !stage) return;
      const scale = Math.min(frame.clientWidth / size.width, frame.clientHeight / size.height);
      stage.style.setProperty('transform', `translate(${(frame.clientWidth-size.width*scale)/2}px,${(frame.clientHeight-size.height*scale)/2}px) scale(${scale})`, 'important');
      inkBoard.layout();
    }
    ['current','next'].forEach(id => {
      const frame = $(id);
      frame.addEventListener('load', () => fit(frame));
      new ResizeObserver(() => fit(frame)).observe(frame);
    });
    function preview(frame, snapshot) {
      frame._size = snapshot;
      if (!snapshot) { frame.srcdoc = ''; return; }
      frame.srcdoc = snapshot.html;
    }
    function refresh() {
      const lastAPI = api;
      try {
        if (!window.opener || window.opener.closed) throw new Error('closed');
        api = window.opener.FrontendSlidesPresenter?.session;
        if (!api) throw new Error('loading');
        if (connectedAPI !== api) { api.connect(window); api.subscribeInk(window,renderInk); connectedAPI = api; stamp = ''; visualStamp = ''; }
        state = api.state();
        $('connection').textContent = '● 已连接'; $('connection').className = ''; $('connection').title='';
        document.querySelectorAll('[data-needs-connection]').forEach(el => { el.disabled = false; });
        $('timer').textContent = formatTime(state.elapsed);
        $('timerToggle').textContent = state.running ? '暂停计时' : '开始计时';
        $('blackBadge').hidden = !state.blank;
        $('blank').setAttribute('aria-pressed', String(state.blank));
        $('blank').textContent = state.blank ? '恢复画面 · B' : '黑屏 · B';
        $('previous').disabled = state.index === 0;
        $('forward').disabled = state.index === state.count - 1;
        const nextStamp = state.id + ':' + state.revision;
        if (nextStamp !== stamp) {
          // Input saves synchronously. Never replace a focused editor's selection on its own save.
          if (currentIndex !== state.index || document.activeElement !== $('notes')) {
            if ($('notes').value !== state.notes[state.index]) $('notes').value = state.notes[state.index] || '';
            if (currentIndex !== state.index) $('notes').scrollTop = 0;
          }
          currentIndex = state.index;
          $('counter').textContent = `${state.index + 1} / ${state.count}`;
          $('slideTitle').textContent = state.titles[state.index];
          const labels = JSON.stringify(state.titles);
          if ($('jump').dataset.labels !== labels) {
            $('jump').replaceChildren(...state.titles.map((title, i) => new Option(`${i + 1} · ${title}`, i)));
            $('jump').dataset.labels = labels;
          }
          $('jump').value = state.index;
          const nextVisualStamp = state.id + ':' + state.visualRevision;
          if (nextVisualStamp !== visualStamp) {
            preview($('current'), api.snapshot(state.index));
            preview($('next'), api.snapshot(state.index + 1));
            visualStamp = nextVisualStamp;
          }
          $('end').hidden = state.index + 1 < state.count;
          $('saveStatus').textContent = state.saved ? '讲稿自动保存于本浏览器' : '浏览器存储不可用，请保存 HTML 或导出讲稿';
          stamp = nextStamp;
        }
      } catch (error) {
        $('connection').title=error.message;
        api = null; connectedAPI=null;
        inkBoard.render({mode:'off',index:-1,inkRevision:0,strokes:[],laser:null,blank:true,width:1920,height:1080});
        $('connection').textContent = '● 观众窗口已断开'; $('connection').className = 'offline';
        document.querySelectorAll('[data-needs-connection]').forEach(el => { el.disabled = true; });
      }
      $('clock').textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      (api || lastAPI)?.renderPresenter?.(window, api ? state : null);
    }
    ['previous','forward','jump','notes','blank','timerToggle','timerReset','exportNotes','exportHTML','fullscreen','toolOff','toolLaser','toolPen','clearInk'].forEach(id => $(id).setAttribute('data-needs-connection',''));
    $('toolOff').onclick=()=>action(a=>a.setTool('off'));
    $('toolLaser').onclick=()=>action(a=>a.setTool(inkModel?.mode==='laser'?'off':'laser'));
    $('toolPen').onclick=()=>action(a=>a.setTool(inkModel?.mode==='pen'?'off':'pen'));
    $('clearInk').onclick=()=>action(a=>a.clearInk());
    $('previous').onclick = () => action(a => a.goTo(state.index - 1));
    $('forward').onclick = () => action(a => a.goTo(state.index + 1));
    $('jump').onchange = () => action(a => a.goTo(Number($('jump').value)));
    $('blank').onclick = () => action(a => a.blank());
    $('timerToggle').onclick = () => action(a => a.timer('toggle'));
    $('timerReset').onclick = () => action(a => a.timer('reset'));
    $('notes').addEventListener('input', () => {
      if (api && currentIndex >= 0) api.saveNotes(currentIndex, $('notes').value);
    });
    $('smaller').onclick = () => { fontSize = Math.max(16, fontSize - 2); $('notes').style.fontSize = fontSize + 'px'; };
    $('larger').onclick = () => { fontSize = Math.min(48, fontSize + 2); $('notes').style.fontSize = fontSize + 'px'; };
    $('exportNotes').onclick = () => action(a => a.exportNotes());
    $('exportHTML').onclick = () => action(a => a.exportHTML());
    $('helpToggle').onclick = () => { $('help').hidden = !$('help').hidden; $('helpToggle').setAttribute('aria-expanded', String(!$('help').hidden)); };
    $('screens').onclick = async () => {
      if (!window.getScreenDetails) { message('此浏览器不支持自动选屏。请将原 slides 窗口拖到扩展屏，再在其中按 F。'); return; }
      try {
        const details = await window.getScreenDetails();
        screens = Array.from(details.screens);
        $('screenList').replaceChildren(...screens.map((screen, i) => new Option(screen.label || `显示器 ${i + 1} · ${screen.width}×${screen.height}`, i)));
        $('screenList').hidden = false;
        message('选择观众显示器后点“观众全屏”；本窗口留在电脑。');
      } catch { message('未获得显示器权限。请手动拖动原 slides 窗口到扩展屏，在其中按 F。'); }
    };
    async function fullscreen() {
      if (!api) return;
      try { await api.fullscreen(screens[Number($('screenList').value)]); }
      catch { message('浏览器限制远程全屏：请点击大屏上的 slides，再按 F；也可使用浏览器全屏菜单。'); }
    }
    $('fullscreen').onclick = fullscreen;
    window.addEventListener('keydown', event => {
      if (event.isComposing || editable(event.target) || event.metaKey || event.ctrlKey || event.altKey) return;
      const key = event.key.toLowerCase();
      if (!['arrowright','arrowdown','pagedown',' ','arrowleft','arrowup','pageup','home','end','b','f','l','d','escape'].includes(key)) return;
      event.preventDefault();
      if (event.repeat && ['b','f','l','d'].includes(key)) return;
      if (key === 'f') { fullscreen(); return; }
      action(a => {
        if (['arrowright','arrowdown','pagedown',' '].includes(key)) a.goTo(state.index + 1);
        else if (['arrowleft','arrowup','pageup'].includes(key)) a.goTo(state.index - 1);
        else if (key === 'home') a.goTo(0);
        else if (key === 'end') a.goTo(state.count - 1);
        else if (key === 'b') a.blank();
        else if (key === 'l') a.setTool(inkModel?.mode==='laser'?'off':'laser');
        else if (key === 'd') a.setTool(inkModel?.mode==='pen'?'off':'pen');
        else if (key === 'escape') a.setTool('off');
      });
    });
    refresh();
    setInterval(refresh, 200);
  }
  window.FrontendSlidesPresenter = {version:VERSION, mount};
})();

FrontendSlidesPresenter.mount(window.frontendSlidesPresenterAdapter);
</script>
<!-- frontend-slides-presenter:end -->
</body></html>
